<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>해양 사이버사고 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body data-page="dashboard">

<div class="kpis" id="kpis"></div>

<div class="layout">
  <aside id="filters" aria-label="filters">
    <div class="loading" data-t="loading"></div>
  </aside>

  <main>
    <section class="panel" aria-labelledby="heat-h">
      <h2 id="heat-h" data-t="heat_title"></h2>
      <p class="sub" data-t="heat_sub"></p>
      <div class="heatmap-wrap" id="heatmap"></div>
    </section>

    <div class="toolbar">
      <label class="sr-only" for="q" data-t="f_search_ph"></label>
      <input type="search" id="q" data-t-ph="f_search_ph">
      <div class="seg" id="sort">
        <button type="button" data-sort="new" data-t="sort_new"></button>
        <button type="button" data-sort="old" data-t="sort_old"></button>
      </div>
      <button type="button" class="btn" id="csv" data-t="csv_export"></button>
      <button type="button" class="btn" id="reset" data-t="reset"></button>
    </div>
    <div class="active-filters" id="active-filters"></div>
    <div class="list-head small muted" id="list-count"></div>
    <div id="incident-list"></div>
    <div class="pager" id="pager"></div>
  </main>

  <aside class="detail" id="detail" aria-live="polite"></aside>
</div>

<script src="js/i18n.js?v=10"></script>
<script src="js/dict.js?v=10"></script>
<script src="js/config.js?v=10"></script>
<script src="js/common.js?v=10"></script>
<script src="js/dashboard.js?v=10"></script>
</body>
</html>
