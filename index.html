<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해양 사이버보안사고 대시보드 (프로토타입)</title>
<style>
  :root{
    --bg: #0D1B2A;
    --panel: #13293D;
    --panel-2: #1B3A4B;
    --line: #2A4356;
    --text: #E8ECEF;
    --text-dim: #9FB3C2;
    --accent: #2EC4B6;
    --sev-low: #2EC4B6;
    --sev-med: #F4A300;
    --sev-high: #E85D4C;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header{
    display:flex; align-items:baseline; gap:16px;
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1{
    font-size: 19px; font-weight: 600; margin:0; letter-spacing: 0.2px;
  }
  header p{ margin:0; color: var(--text-dim); font-size: 13px; }

  .stats{
    display:flex; gap:0; padding: 14px 28px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .stat{ flex:1; padding: 0 20px; border-left: 1px solid var(--line); }
  .stat:first-child{ border-left: none; padding-left:0; }
  .stat .num{ font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .label{ font-size: 12px; color: var(--text-dim); margin-top:2px; }
  .bar-row{ display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; }
  .bar-track{ flex:1; height:6px; background: var(--line); border-radius: 3px; overflow:hidden; }
  .bar-fill{ height:100%; background: var(--accent); }

  .layout{ display:flex; flex:1; min-height:0; }

  aside{
    width: 240px; flex-shrink:0; padding: 18px; border-right: 1px solid var(--line);
    overflow-y:auto;
  }
  aside h2{ font-size: 12px; color: var(--text-dim); font-weight:600; margin: 18px 0 8px; }
  aside h2:first-child{ margin-top:0; }
  .filter-group{ display:flex; flex-direction:column; gap:6px; }
  .chip{
    display:flex; justify-content:space-between; align-items:center;
    padding: 7px 10px; border-radius:6px; font-size: 13px; cursor:pointer;
    border: 1px solid transparent; color: var(--text-dim);
  }
  .chip:hover{ background: var(--panel); }
  .chip.active{ background: var(--panel-2); color: var(--text); border-color: var(--line); }
  .chip .count{ font-size: 11px; color: var(--text-dim); }
  .reset-btn{
    margin-top: 16px; width:100%; padding: 8px; background:none; color: var(--accent);
    border: 1px solid var(--line); border-radius:6px; font-size:12px; cursor:pointer;
  }
  .reset-btn:hover{ border-color: var(--accent); }

  main{ flex:1; overflow-y:auto; padding: 18px 24px; }
  .list-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .list-head span{ color: var(--text-dim); font-size: 13px; }

  .incident{
    display:grid; grid-template-columns: 4px 90px 1fr 130px 90px;
    align-items:center; gap: 16px;
    padding: 12px 14px; margin-bottom:6px; border-radius:8px;
    background: var(--panel); cursor:pointer; border:1px solid transparent;
  }
  .incident:hover{ border-color: var(--line); }
  .incident.selected{ border-color: var(--accent); background: var(--panel-2); }
  .sev-dot{ width:4px; height:28px; border-radius:2px; }
  .incident .asset{ font-size: 11px; color: var(--text-dim); }
  .incident .title{ font-size: 14px; }
  .incident .id{ font-family: "SFMono-Regular", Menlo, monospace; font-size: 11px; color: var(--text-dim); }
  .incident .date{ font-size: 12px; color: var(--text-dim); text-align:right; }

  .detail{
    width: 340px; flex-shrink:0; border-left: 1px solid var(--line);
    padding: 22px; overflow-y:auto;
  }
  .detail .empty{ color: var(--text-dim); font-size: 13px; margin-top: 40px; text-align:center; }
  .detail .id{ font-family: monospace; font-size: 12px; color: var(--text-dim); }
  .detail h3{ font-size: 17px; margin: 6px 0 2px; }
  .detail .meta-row{ display:flex; gap:8px; margin: 10px 0 16px; flex-wrap:wrap; }
  .tag{ font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--panel-2); color: var(--text-dim); }
  .detail p.desc{ font-size: 13px; line-height:1.6; color: var(--text-dim); }
  .reg-block{ margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .reg-block h4{ font-size: 12px; color: var(--text-dim); font-weight:600; margin: 0 0 10px; }
  .reg-item{
    padding: 10px 12px; margin-bottom: 8px; border-radius: 6px;
    background: var(--panel-2); border-left: 3px solid var(--accent);
  }
  .reg-item .code{ font-family: monospace; font-size: 12px; color: var(--accent); }
  .reg-item .desc{ font-size: 12.5px; margin-top: 3px; color: var(--text); }
</style>
</head>
<body>

<header>
  <h1>해양 사이버보안사고 대시보드</h1>
  <p>자산유형별 위협 가시화 · IMO/IACS 규제 연계 — 프로토타입 (더미 데이터)</p>
</header>

<div class="stats" id="stats"></div>

<div class="layout">
  <aside>
    <h2>자산 유형</h2>
    <div class="filter-group" id="filter-asset"></div>
    <h2>피해 국가</h2>
    <div class="filter-group" id="filter-country"></div>
    <h2>심각도</h2>
    <div class="filter-group" id="filter-severity"></div>
    <button class="reset-btn" onclick="resetFilters()">필터 초기화</button>
  </aside>

  <main>
    <div class="list-head">
      <span id="list-count"></span>
    </div>
    <div id="incident-list"></div>
  </main>

  <div class="detail" id="detail">
    <div class="empty">사고를 선택하면<br>상세 정보와 관련 규제가<br>여기에 표시됩니다</div>
  </div>
</div>

<script>
// ---------------------------------------------------------
// 더미 데이터: 실제 정규화 데이터가 준비되면 이 배열을
// fetch('data.json')로 불러오는 코드로 교체하면 됩니다.
// ---------------------------------------------------------
const INCIDENTS = [
  { id:"MCAD-2023-014", title:"선박 ECDIS 위치정보 스푸핑", date:"2023-04-02",
    asset:"항해장비(ECDIS/GPS)", country:"우크라이나 인근 해역", severity:"high",
    desc:"흑해 해역에서 다수 선박의 GPS 신호가 조작되어 실제와 다른 위치가 표시된 사례. 항로 이탈 및 충돌 위험을 유발.",
    regs:[
      {code:"IMO MSC.428(98)", desc:"해상 사이버리스크 관리를 안전관리시스템(SMS)에 통합"},
      {code:"IACS UR E26", desc:"선박 사이버 복원력 요건 — 항해시스템 보호"}
    ]},
  { id:"MCAD-2023-021", title:"항만 터미널 운영시스템(TOS) 랜섬웨어", date:"2023-06-15",
    asset:"항만 인프라(TOS)", country:"대한민국", severity:"high",
    desc:"컨테이너 터미널 운영시스템이 랜섬웨어에 감염되어 하역 작업이 약 18시간 중단됨.",
    regs:[
      {code:"IMO MSC-FAL.1/Circ.3", desc:"해상 사이버리스크 관리 가이드라인 — 항만 인터페이스 시스템 포함"},
      {code:"ISPS Code Part A", desc:"항만시설 보안계획(PFSP)상 사이버 위협 대응 요건"}
    ]},
  { id:"MCAD-2022-098", title:"선박 위성통신(VSAT) 단말 침해", date:"2022-11-08",
    asset:"통신장비(VSAT)", country:"파나마", severity:"medium",
    desc:"기본 관리자 계정을 사용하던 VSAT 단말이 스캐닝 및 원격 접근 시도를 받음.",
    regs:[
      {code:"IACS UR E27", desc:"선박 시스템 및 장비의 사이버 보안 요건 — 원격접속 통제"}
    ]},
  { id:"MCAD-2022-071", title:"엔진룸 제어시스템(OT) 악성코드 감염", date:"2022-08-22",
    asset:"선박 OT(엔진제어)", country:"싱가포르", severity:"high",
    desc:"USB 매체를 통해 엔진 모니터링 PC에 악성코드가 유입, 일부 센서 데이터 표시 오류 발생.",
    regs:[
      {code:"IACS UR E26", desc:"선박 사이버 복원력 요건 — OT 네트워크 분리 및 이동식 매체 통제"},
      {code:"IMO MSC.428(98)", desc:"해상 사이버리스크 관리를 안전관리시스템(SMS)에 통합"}
    ]},
  { id:"MCAD-2021-053", title:"해운사 IT 서버 데이터 유출", date:"2021-09-30",
    asset:"IT 시스템(사내망)", country:"일본", severity:"medium",
    desc:"피싱 이메일을 통한 자격증명 탈취 이후 화물 예약 데이터베이스 일부가 유출됨.",
    regs:[
      {code:"IMO MSC-FAL.1/Circ.3", desc:"해상 사이버리스크 관리 가이드라인 — IT 시스템 리스크 평가"}
    ]},
  { id:"MCAD-2021-040", title:"항만 크레인 제어시스템 오작동 유발 침해", date:"2021-05-11",
    asset:"항만 인프라(크레인 제어)", country:"네덜란드", severity:"medium",
    desc:"원격 유지보수 접속 경로를 통한 미승인 접근으로 크레인 제어 소프트웨어에 이상 명령이 전달됨.",
    regs:[
      {code:"ISPS Code Part A", desc:"항만시설 보안계획(PFSP)상 사이버 위협 대응 요건"},
      {code:"IACS UR E27", desc:"선박 시스템 및 장비의 사이버 보안 요건 — 원격접속 통제"}
    ]},
  { id:"MCAD-2020-019", title:"선사 이메일 시스템 랜섬웨어 확산", date:"2020-06-27",
    asset:"IT 시스템(사내망)", country:"덴마크", severity:"high",
    desc:"전사 이메일 및 예약 시스템이 랜섬웨어에 감염되어 수 일간 수기 운영으로 전환.",
    regs:[
      {code:"IMO MSC.428(98)", desc:"해상 사이버리스크 관리를 안전관리시스템(SMS)에 통합"}
    ]},
  { id:"MCAD-2020-003", title:"선박 자동식별장치(AIS) 신호 조작", date:"2020-02-14",
    asset:"항해장비(AIS)", country:"이란 인근 해역", severity:"low",
    desc:"AIS 신호가 실제와 다른 선박 정보로 송출된 정황이 포착됨. 항해 안전에 직접 영향은 미미.",
    regs:[
      {code:"IACS UR E26", desc:"선박 사이버 복원력 요건 — 항해시스템 보호"}
    ]},
];

const SEVERITY_LABEL = { high:"높음", medium:"중간", low:"낮음" };

let filters = { asset:null, country:null, severity:null };
let selectedId = null;

function uniqueCounts(key){
  const counts = {};
  INCIDENTS.forEach(i => counts[i[key]] = (counts[i[key]]||0) + 1);
  return counts;
}

function renderFilters(){
  renderFilterGroup('filter-asset', 'asset', uniqueCounts('asset'));
  renderFilterGroup('filter-country', 'country', uniqueCounts('country'));
  renderFilterGroup('filter-severity', 'severity', uniqueCounts('severity'), SEVERITY_LABEL);
}

function renderFilterGroup(elId, key, counts, labelMap){
  const el = document.getElementById(elId);
  el.innerHTML = '';
  Object.entries(counts).forEach(([value, count]) => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (filters[key] === value ? ' active' : '');
    chip.innerHTML = `<span>${labelMap ? labelMap[value] : value}</span><span class="count">${count}</span>`;
    chip.onclick = () => {
      filters[key] = filters[key] === value ? null : value;
      renderAll();
    };
    el.appendChild(chip);
  });
}

function resetFilters(){
  filters = { asset:null, country:null, severity:null };
  renderAll();
}

function filteredIncidents(){
  return INCIDENTS.filter(i =>
    (!filters.asset || i.asset === filters.asset) &&
    (!filters.country || i.country === filters.country) &&
    (!filters.severity || i.severity === filters.severity)
  );
}

function renderStats(){
  const el = document.getElementById('stats');
  const total = INCIDENTS.length;
  const byAsset = uniqueCounts('asset');
  const max = Math.max(...Object.values(byAsset));
  const topAssets = Object.entries(byAsset).sort((a,b) => b[1]-a[1]).slice(0,3);

  el.innerHTML = `
    <div class="stat">
      <div class="num">${total}</div>
      <div class="label">전체 사고 건수</div>
    </div>
    <div class="stat" style="flex:2">
      <div class="label" style="margin-bottom:8px;">자산유형별 상위 3</div>
      ${topAssets.map(([name,count]) => `
        <div class="bar-row">
          <span style="width:150px; color:var(--text);">${name}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(count/max*100)}%"></div></div>
          <span style="width:16px; text-align:right;">${count}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function renderList(){
  const list = filteredIncidents().sort((a,b) => b.date.localeCompare(a.date));
  document.getElementById('list-count').textContent = `${list.length}건 표시 중`;
  const el = document.getElementById('incident-list');
  el.innerHTML = '';
  list.forEach(i => {
    const row = document.createElement('div');
    row.className = 'incident' + (i.id === selectedId ? ' selected' : '');
    row.innerHTML = `
      <div class="sev-dot" style="background:var(--sev-${i.severity})"></div>
      <div class="asset">${i.asset}</div>
      <div class="title">${i.title}</div>
      <div class="id">${i.id}</div>
      <div class="date">${i.date}</div>
    `;
    row.onclick = () => { selectedId = i.id; renderDetail(); renderList(); };
    el.appendChild(row);
  });
}

function renderDetail(){
  const el = document.getElementById('detail');
  const i = INCIDENTS.find(x => x.id === selectedId);
  if(!i){ el.innerHTML = '<div class="empty">사고를 선택하면<br>상세 정보와 관련 규제가<br>여기에 표시됩니다</div>'; return; }
  el.innerHTML = `
    <div class="id">${i.id}</div>
    <h3>${i.title}</h3>
    <div class="meta-row">
      <span class="tag">${i.asset}</span>
      <span class="tag">${i.country}</span>
      <span class="tag" style="color:var(--sev-${i.severity})">심각도: ${SEVERITY_LABEL[i.severity]}</span>
      <span class="tag">${i.date}</span>
    </div>
    <p class="desc">${i.desc}</p>
    <div class="reg-block">
      <h4>관련 IMO / IACS 통제 항목</h4>
      ${i.regs.map(r => `
        <div class="reg-item">
          <div class="code">${r.code}</div>
          <div class="desc">${r.desc}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderAll(){
  renderFilters();
  renderStats();
  renderList();
  renderDetail();
}

renderAll();
</script>
</body>
</html>
