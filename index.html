<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해양 사이버보안사고 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 data-i18n="site_title"></h1>
  <p data-i18n="dashboard_subtitle"></p>
  <nav class="topnav">
    <a href="index.html" class="active" data-i18n="nav_dashboard"></a>
    <a href="stats.html" data-i18n="nav_stats"></a>
    <span class="lang-toggle">
      <button data-lang="ko">KO</button>
      <button data-lang="en">EN</button>
    </span>
  </nav>
</header>

<div class="stats" id="stats"></div>

<div class="layout">
  <aside>
    <h2 data-i18n="filter_asset"></h2>
    <div class="filter-group" id="filter-asset"></div>
    <h2 data-i18n="filter_attack"></h2>
    <div class="filter-group" id="filter-attack"></div>
    <h2 data-i18n="filter_country"></h2>
    <div class="filter-group" id="filter-country"></div>
    <h2 data-i18n="filter_severity"></h2>
    <div class="filter-group" id="filter-severity"></div>
    <button class="reset-btn" data-i18n="reset_filters" onclick="resetFilters()"></button>
  </aside>

  <main>
    <div class="heatmap-block">
      <h2 data-i18n="heatmap_title"></h2>
      <div id="heatmap"></div>
    </div>

    <div class="list-head">
      <span id="list-count"></span>
    </div>
    <div id="incident-list"><div class="loading" data-i18n="loading"></div></div>
  </main>

  <div class="detail" id="detail">
    <div class="empty" data-i18n="detail_empty"></div>
  </div>
</div>

<footer id="site-footer"></footer>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
