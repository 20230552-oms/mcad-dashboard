<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해양 사이버보안사고 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>해양 사이버보안사고 대시보드</h1>
  <p>자산유형별 위협 가시화 · IMO/IACS 규제 연계</p>
  <nav class="topnav">
    <a href="index.html" class="active">대시보드</a>
    <a href="stats.html">통계</a>
  </nav>
</header>

<div class="stats" id="stats"></div>

<div class="layout">
  <aside>
    <h2>자산 유형</h2>
    <div class="filter-group" id="filter-asset"></div>
    <h2>공격 유형</h2>
    <div class="filter-group" id="filter-attack"></div>
    <h2>피해 국가</h2>
    <div class="filter-group" id="filter-country"></div>
    <h2>심각도</h2>
    <div class="filter-group" id="filter-severity"></div>
    <button class="reset-btn" onclick="resetFilters()">필터 초기화</button>
  </aside>

  <main>
    <div class="heatmap-block">
      <h2>자산유형 × 심각도</h2>
      <div id="heatmap"></div>
    </div>

    <div class="list-head">
      <span id="list-count"></span>
    </div>
    <div id="incident-list"><div class="loading">데이터를 불러오는 중...</div></div>
  </main>

  <div class="detail" id="detail">
    <div class="empty">사고를 선택하면<br>상세 정보와 관련 규제가<br>여기에 표시됩니다</div>
  </div>
</div>

<footer>
  데이터 출처: <a href="https://www.nhlstenden.com/en/maritime-cyber-attack-database" target="_blank" rel="noopener">NHL Stenden — Maritime Cyber Attack Database (MCAD)</a>. 위 데이터는 연구 목적으로 정규화·가공되었습니다.
</footer>

<script src="script.js"></script>
</body>
</html>
