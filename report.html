<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>사고 제보</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body data-page="report" data-title-key="nav_report">
<main class="page" id="rp-root">
  <h2 style="margin:0" data-t="nav_report"></h2>
  <p class="sub muted" data-t="rp_sub"></p>
  <div id="mode-box"></div>

  <div class="grid-2" style="align-items:start">
    <section class="panel">
      <h2 data-t="rp_form"></h2>
      <form id="rp-form" novalidate autocomplete="off">
        <label class="field"><span data-t="rp_f_title"></span><input type="text" name="title" maxlength="200" required></label>
        <div class="grid-2" style="gap:12px">
          <label class="field"><span data-t="rp_f_date"></span><input type="date" name="date" min="1980-01-01"></label>
          <label class="field"><span data-t="rp_f_country"></span><select name="country" id="rp-country"></select></label>
          <label class="field"><span data-t="rp_f_asset"></span><select name="asset" id="rp-asset"></select></label>
          <label class="field"><span data-t="rp_f_attack"></span><select name="attack" id="rp-attack"></select></label>
        </div>
        <label class="field"><span data-t="rp_f_lang"></span><select name="lang" id="rp-lang"></select></label>
        <label class="field"><span data-t="rp_f_body"></span><textarea name="body" maxlength="5000" required></textarea></label>
        <label class="field"><span data-t="rp_f_urls"></span><textarea name="urls" rows="3" style="min-height:70px" placeholder="https://"></textarea>
          <span class="small" data-t="rp_f_urls_hint" style="margin-top:4px"></span></label>
        <!-- 봇 차단용 숨김 칸: 사람은 보지 못하므로 값이 들어오면 자동 제출로 간주 -->
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
        <div class="btn-row">
          <button type="button" class="btn" id="rp-preview" data-t="rp_preview"></button>
          <button type="submit" class="btn primary" data-t="rp_submit"></button>
          <span class="small" id="rp-msg" role="status"></span>
        </div>
      </form>
    </section>

    <section class="panel" id="rp-check-panel">
      <h2 data-t="rp_auto_title"></h2>
      <p class="sub" data-t="rp_auto_note"></p>
      <div id="rp-check"><div class="empty">—</div></div>
    </section>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2 data-t="rp_list"></h2>
      <div class="seg" id="rp-filter">
        <button type="button" data-f="all" aria-pressed="true" data-t="rp_filter_all"></button>
        <button type="button" data-f="asia" aria-pressed="false" data-t="st_scope_asia"></button>
      </div>
    </div>
    <div id="rp-list"></div>
  </section>
</main>
<script src="js/i18n.js?v=10"></script>
<script src="js/dict.js?v=10"></script>
<script src="js/config.js?v=10"></script>
<script src="js/common.js?v=10"></script>
<script src="js/report.js?v=10"></script>
</body>
</html>
