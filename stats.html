<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통계 — 해양 사이버보안사고 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 data-i18n="site_title"></h1>
  <p data-i18n="stats_subtitle"></p>
  <nav class="topnav">
    <a href="index.html" data-i18n="nav_dashboard"></a>
    <a href="stats.html" class="active" data-i18n="nav_stats"></a>
    <span class="lang-toggle">
      <button data-lang="ko">KO</button>
      <button data-lang="en">EN</button>
    </span>
  </nav>
</header>

<main class="stats-page">
  <section class="panel">
    <div class="panel-head">
      <h2 data-i18n="ts_title"></h2>
      <span class="panel-note" id="total-count"></span>
    </div>
    <div id="timeseries"></div>
  </section>

  <div class="panel-cols">
    <section class="panel">
      <div class="panel-head"><h2 data-i18n="country_title"></h2></div>
      <div id="country-chart"></div>
      <table class="data-table" id="country-table"></table>
    </section>

    <section class="panel">
      <div class="panel-head"><h2 data-i18n="attack_title"></h2></div>
      <div id="attack-chart"></div>
      <table class="data-table" id="attack-table"></table>
    </section>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="i18n.js"></script>
<script src="stats.js"></script>
</body>
</html>
